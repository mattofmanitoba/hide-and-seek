function fmtDur(ms) {
  const s = Math.floor(ms / 1000);

}

async function load() {
  // Game info
  const { data: game } = await sb.from('games').select('*').eq('room_code', gameCode).single();
  if (game) {
    document.getElementById('gameName').textContent = game.room_name || ('Game ' + gameCode.slice(0, 8));
    document.getElementById('gameDate').textContent = new Date(game.created_at).toLocaleDateString();
  }
  // Positions
  const { data: pos } = await sb.from('positions').select('*').eq('room_code', gameCode).order('recorded_at');
  if (!pos || pos.length === 0) {
    document.getElementById('loading').textContent = 'No track data for this game yet.';
    return;
  }
  // Group by player
  const players = {};
  let ci = 0;
  pos.forEach(p => {
    if (!players[p.player_name]) players[p.player_name] = { track: [], color: COLORS[ci++ % COLORS.length] };
    players[p.player_name].track.push({ lat: p.lat, lon: p.lon, t: new Date(p.recorded_at).getTime(), role: p.role });
  });
  const allT = pos.map(p => new Date(p.recorded_at).getTime());
  gameData = { players, startT: Math.min(...allT), endT: Math.max(...allT) };
  curT = gameData.startT;

  // Draw full tracks (faint) and markers
  Object.entries(players).forEach(([name, pd]) => {
    const latlngs = pd.track.map(p => [p.lat, p.lon]);
    trackLines[name] = L.polyline(latlngs, { color: pd.color, weight: 2, opacity: 0.25 }).addTo(map);
    const icon = L.divIcon({ className: '', html: `<div style="background:${pd.color};color:#fff;border-radius:12px;padding:3px 8px;font-size:11px;font-weight:700;white-space:nowrap;border:2px solid #fff">${name}</div>`, iconSize: [0,0] });
    markers[name] = L.marker(latlngs[0], { icon }).addTo(map);
  });
  map.fitBounds(L.polygon(ZONE).getBounds().pad(0.05));

  // Stats: hider durations
  const stats = [];
  Object.entries(players).forEach(([name, pd]) => {
    let hideMs = 0, curStart = null, longest = 0;
    pd.track.forEach(p => {
      if (p.role === 'hider' && curStart === null) curStart = p.t;
      if (p.role !== 'hider' && curStart !== null) {
        const d = p.t - curStart; hideMs += d; longest = Math.max(longest, d); curStart = null;
      }
    });
    if (curStart !== null) { const d = pd.track[pd.track.length-1].t - curStart; hideMs += d; longest = Math.max(longest, d); }
    stats.push({ name, hideMs, longest, color: pd.color });
  });
  stats.sort((a, b) => b.longest - a.longest);
  const sb2 = document.getElementById('statsBody');
  sb2.innerHTML = stats.map((s, i) =>

  ).join('') || '<div class="stat">No hider data</div>';

  document.getElementById('loading').style.display = 'none';
  updateTime();
}

function interpTrack(track, t) {
  if (t <= track[0].t) return track[0];
  for (let i = 1; i < track.length; i++) {
    if (track[i].t >= t) {
      const a = track[i-1], b = track[i];
      const f = (t - a.t) / Math.max(1, b.t - a.t);
      return { lat: a.lat + (b.lat - a.lat) * f, lon: a.lon + (b.lon - a.lon) * f };
    }
  }
  return track[track.length - 1];
}

  const el = Math.floor((curT - gameData.startT) / 1000);
  document.getElementById('timeLabel').textContent = fmtDur(curT - gameData.startT);
  document.getElementById('scrub').value = 1000 * (curT - gameData.startT) / Math.max(1, gameData.endT - gameData.startT);
  Object.entries(gameData.players).forEach(([name, pd]) => {
    const p = interpTrack(pd.track, curT);
    markers[name].setLatLng([p.lat, p.lon]);
  });
}

let lastFrame = 0;
function tick(ts) {
  if (!playing) return;
  if (!lastFrame) lastFrame = ts;
  const dt = (ts - lastFrame) * SPEEDS[speedIdx];
  lastFrame = ts;
  curT += dt;
  if (curT >= gameData.endT) { curT = gameData.endT; pause(); }
  updateTime();
  animId = requestAnimationFrame(tick);
}
function play() { playing = true; lastFrame = 0; document.getElementById('playBtn').textContent = '⏸ Pause'; animId = requestAnimationFrame(tick); }
function pause() { playing = false; document.getElementById('playBtn').textContent = '▶ Play'; cancelAnimationFrame(animId); }

document.getElementById('playBtn').addEventListener('click', () => {
  if (!gameData) return;
  if (curT >= gameData.endT) curT = gameData.startT;
  playing ? pause() : play();
});
document.getElementById('speedBtn').addEventListener('click', e => {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  e.target.textContent = SPEEDS[speedIdx] + '×';
});
document.getElementById('scrub').addEventListener('input', e => {
  if (!gameData) return;
  pause();
  curT = gameData.startT + (e.target.value / 1000) * (gameData.endT - gameData.startT);
  updateTime();
});
document.getElementById('shareBtn').addEventListener('click', async () => {
  const url = window.location.href;
  if (navigator.share) { try { await navigator.share({ title: 'Game Replay', url }); } catch (e) {} }
  else { try { await navigator.clipboard.writeText(url); alert('Link copied!'); } catch (e) { prompt('Copy link:', url); } }
});
document.getElementById('gpxBtn').addEventListener('click', () => {
  if (!gameData) return;
  let gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="JetLagHideSeek">\n`;
  Object.entries(gameData.players).forEach(([name, pd]) => {
    gpx += ` <trk><name>${name}</name><trkseg>\n`;
    pd.track.forEach(p => {
      gpx += `  <trkpt lat="${p.lat}" lon="${p.lon}"><time>${new Date(p.t).toISOString()}</time></trkpt>\n`;
    });
    gpx += ` </trkseg></trk>\n`;
  });
  gpx += `</gpx>`;
  const blob = new Blob([gpx], { type: 'application/gpx+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'game-' + gameCode.slice(0, 8) + '.gpx';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
});

load();
</script>
